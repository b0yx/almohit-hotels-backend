              code: "123456"
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail: { type: string, example: "Email verified successfully." }
        "400":
          description: Invalid code
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail: { type: string }
                  code: { type: string, example: invalid_otp }

