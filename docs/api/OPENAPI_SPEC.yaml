      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_name, phone, property, room_type, check_in, check_out, adults]
              properties:
                customer_name: { type: string }
                phone: { type: string }
                email: { type: string, format: email }
                property: { type: integer, description: Hotel ID }
                room_type: { type: integer, description: RoomType ID }
                check_in: { type: string, format: date }
                check_out: { type: string, format: date }
                adults: { type: integer }
                children: { type: integer }
                infants: { type: integer }
                extra_bed_needed: { type: boolean }
                extra_bed_count: { type: integer }
                guests: { type: array, items: { type: object } }
            example:
              customer_name: "John Doe"
              phone: "+1234567890"
              email: "john@example.com"
              property: 1
              room_type: 1
              check_in: "2026-07-01"
              check_out: "2026-07-03"
              adults: 2
              children: 0
      responses:
        "201":
          description: Booking inquiry created
          content:
            application/json:
              schema:
                type: object
                properties:
                  booking_id: { type: integer }
                  customer_name: { type: string }
                  phone: { type: string }
                  email: { type: string }
                  property_id: { type: integer }
                  room_type_id: { type: integer }
                  check_in: { type: string, format: date }
                  check_out: { type: string, format: date }
                  adults: { type: integer }
