openapi: 3.0.3
info:
  title: Almohit Hotels API
  description: |
    RESTful API for Almohit Hotels platform. Provides hotel listings, room types,
    bookings, reviews, services, and image management with role-based access control.

    **Auth:** Bearer token via `Authorization: Bearer <token>` header.
    **Tenant:** Subdomain via `X-Hotel-Subdomain` header or hostname.
    **Pagination:** DRF-compatible `{ count, next, previous, results }`.
    **Errors:** snake_case JSON `{ detail, code }`.
  version: 1.0.0
  contact:
    email: dev@almohit.com
servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://your-app.laravel.cloud
    description: Production

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Accepts both `Bearer <token>` and `Token <token>` formats.
        Token returned from `/api/auth/login/` as `access` field.

  parameters:
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
      description: Page number for pagination
    PageSizeParam:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Number of results per page
    SearchParam:
      name: search
      in: query
      schema: { type: string }
      description: Search across name, email, customer_name, subject
    HotelSubdomainHeader:
      name: X-Hotel-Subdomain
      in: header
      schema: { type: string }
      description: Resolve public hotel context (e.g. "demo" for demo.almohit.com)
      required: false

  schemas:
    ErrorResponse:
      type: object
      properties:
        detail: { type: string }
        code: { type: string }
      example:
        detail: "Invalid email or password."
        code: "invalid_credentials"

    ValidationError:
      type: object
      properties:
        field_name:
          type: array
          items: { type: string }
      example:
        email: ["The email field is required."]
        password: ["The password must be at least 8 characters."]

    PaginatedResponse:
      type: object
      properties:
        count: { type: integer, description: Total results }
        next: { type: string, nullable: true, description: Next page URL }
        previous: { type: string, nullable: true, description: Previous page URL }
        results: { type: array, items: { type: object } }

    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        full_name: { type: string }
        phone: { type: string }
        role: { type: string, enum: [customer, staff, admin] }
        is_staff: { type: boolean }
        is_active: { type: boolean }
        email_verified: { type: boolean }
        created_at: { type: string, format: date-time }

    LoginResponse:
      type: object
      properties:
        token: { type: string, description: API token (same as access) }
        access: { type: string, description: Bearer token }
        token_type: { type: string, enum: [Bearer] }
        role: { type: string, enum: [customer, staff, admin] }
        redirect_url: { type: string, format: uri }
        user: { $ref: '#/components/schemas/User' }

    # Arabic content fields are plain content fields. SEO metadata, localized slugs, canonical URLs, and locale fallback are future phases.

    Hotel:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        name_ar: { type: string, nullable: true }
        slug: { type: string }
        subdomain: { type: string }
        property_type: { type: string, default: hotel }
        country: { type: string }
        city: { type: string }
        address: { type: string }
        phone: { type: string }
        email: { type: string }
        website: { type: string }
        stars: { type: integer, minimum: 1, maximum: 5 }
        description: { type: string }
        description_ar: { type: string, nullable: true }
        short_description: { type: string }
        short_description_ar: { type: string, nullable: true }
        meta_title: { type: string, maxLength: 60, nullable: true }
        meta_description: { type: string, maxLength: 160, nullable: true }
        meta_title_ar: { type: string, maxLength: 60, nullable: true }
        meta_description_ar: { type: string, maxLength: 160, nullable: true }
        timezone: { type: string, default: UTC }
        languages_spoken: { type: array, items: { type: string } }
        parking_available: { type: boolean }
        airport_transfer: { type: boolean }
        shuttle_service: { type: boolean }
        opening_year: { type: integer, nullable: true }
        renovation_year: { type: integer, nullable: true }
        video_url: { type: string }
        virtual_tour_url: { type: string }
        cover_image_url: { type: string, nullable: true }
        average_rating: { type: number, nullable: true }
        total_reviews: { type: integer }
        amenities: { type: array, items: { type: object } }
        images: { type: array, items: { type: object } }
        policy: { $ref: '#/components/schemas/HotelPolicy', nullable: true }
        social_media: { type: object, nullable: true }
        contacts: { type: object, nullable: true }
        setup_status: { type: object, nullable: true }
        is_active: { type: boolean }
        publishing_status: { type: string, enum: [draft, published, archived] }
        published_at: { type: string, format: date-time, nullable: true }
        owner: { type: integer, nullable: true }
        readiness_errors: { type: array, items: { type: string } }
        is_ready_to_publish: { type: boolean }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BlogPost:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        slug: { type: string }
        excerpt: { type: string }
        content: { type: string }
        featured_image: { type: string }
        featured_image_alt: { type: string }
        meta_title: { type: string, maxLength: 60, nullable: true }
        meta_description: { type: string, maxLength: 160, nullable: true }
        meta_title_ar: { type: string, maxLength: 60, nullable: true }
        meta_description_ar: { type: string, maxLength: 160, nullable: true }
        status: { type: string, enum: [draft, scheduled, published, archived] }
        published_at: { type: string, format: date-time, nullable: true }
        locale: { type: string, enum: [ar, en] }
        author: { type: object, nullable: true }
        category: { type: object, nullable: true }
        hotel: { $ref: '#/components/schemas/Hotel', nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BlogPostRequest:
      type: object
      required: [title, slug, excerpt, content, featured_image, featured_image_alt, status, published_at, locale, author_id, category_id]
      properties:
        title: { type: string, maxLength: 255 }
        slug: { type: string, maxLength: 255 }
        excerpt: { type: string }
        content: { type: string }
        featured_image: { type: string, maxLength: 500 }
        featured_image_alt: { type: string, maxLength: 255 }
        meta_title: { type: string, maxLength: 60, nullable: true }
        meta_description: { type: string, maxLength: 160, nullable: true }
        meta_title_ar: { type: string, maxLength: 60, nullable: true }
        meta_description_ar: { type: string, maxLength: 160, nullable: true }
        status: { type: string, enum: [draft, scheduled, published, archived] }
        published_at: { type: string, format: date-time }
        locale: { type: string, enum: [ar, en] }
        author_id: { type: integer }
        category_id: { type: integer }
        hotel_id: { type: integer, nullable: true }

    BlogCategory:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        locale: { type: string, enum: [ar, en] }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BlogCategoryRequest:
      type: object
      required: [name, slug, locale]
      properties:
        name: { type: string, maxLength: 150 }
        slug: { type: string, maxLength: 180 }
        description: { type: string, nullable: true }
        locale: { type: string, enum: [ar, en] }
        is_active: { type: boolean, nullable: true }

    HotelPolicy:
      type: object
      properties:
        cancellation_policy: { type: string, nullable: true }
        cancellation_policy_ar: { type: string, nullable: true }
        children_policy: { type: string, nullable: true }
        children_policy_ar: { type: string, nullable: true }
        pet_policy: { type: string, nullable: true }
        pet_policy_ar: { type: string, nullable: true }
        smoking_policy: { type: string, nullable: true }
        smoking_policy_ar: { type: string, nullable: true }
        extra_bed_policy: { type: string, nullable: true }
        extra_bed_policy_ar: { type: string, nullable: true }
        check_in_time: { type: string, nullable: true }
        check_out_time: { type: string, nullable: true }

    RoomType:
      type: object
      properties:
        id: { type: integer }
        property: { type: integer, description: Hotel ID }
        name: { type: string }
        description: { type: string }
        name_ar: { type: string, nullable: true }
        description_ar: { type: string, nullable: true }
        room_size: { type: number, nullable: true }
        bed_type: { type: string }
        smoking_allowed: { type: boolean }
        max_adults: { type: integer }
        max_children: { type: integer }
        total_units: { type: integer }
        base_price: { type: string, description: Decimal as string }
        weekend_price: { type: string, nullable: true, description: Decimal as string }
        pricing_mode: { type: string, default: per_night }
        currency: { type: string, default: USD }
        extra_bed_allowed: { type: boolean }
        extra_bed_price: { type: string, description: Decimal as string }
        breakfast_included: { type: boolean }
        is_active: { type: boolean }
        cover_image_url: { type: string, nullable: true }
        images: { type: array, items: { type: object } }
        prices: { type: array, items: { type: object } }
        amenity_details: { type: array, items: { type: object } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BookingInquiry:
      type: object
      properties:
        id: { type: integer }
        customer_name: { type: string }
        phone: { type: string }
        email: { type: string }
        customer: { type: integer, nullable: true, description: User ID }
        property: { type: integer, description: Hotel ID }
        property_name: { type: string }
        room_type: { type: integer, description: RoomType ID }
        room_type_name: { type: string }
        check_in: { type: string, format: date }
        check_out: { type: string, format: date }
        nights: { type: integer }
        adults: { type: integer }
        children: { type: integer }
        infants: { type: integer }
        extra_bed_needed: { type: boolean }
        extra_bed_count: { type: integer }
        estimated_total: { type: string, description: Decimal as string }
        status: { type: string, enum: [new, confirmed, cancelled, inquiry, pending] }
        guests: { type: array, items: { type: object } }
        available_units_after_booking: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Review:
      type: object
      properties:
        id: { type: integer }
        property: { type: integer, description: Hotel ID }
        guest_name: { type: string }
        guest_email: { type: string }
        user_id: { type: integer, nullable: true }
        rating: { type: integer, minimum: 1, maximum: 5 }
        title: { type: string }
        comment: { type: string }
        cleanliness: { type: integer, nullable: true }
        location: { type: integer, nullable: true }
        staff: { type: integer, nullable: true }
        comfort: { type: integer, nullable: true }
        value_for_money: { type: integer, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }

    ReviewSummary:
      type: object
      properties:
        average_rating: { type: number, nullable: true }
        total_reviews: { type: integer }
        rating_breakdown:
          type: object
          properties:
            "1": { type: integer }
            "2": { type: integer }
            "3": { type: integer }
            "4": { type: integer }
            "5": { type: integer }
        category_averages:
          type: object
          properties:
            cleanliness: { type: number, nullable: true }
            location: { type: number, nullable: true }
            staff: { type: number, nullable: true }
            comfort: { type: number, nullable: true }
            value_for_money: { type: number, nullable: true }

    ServiceCategory:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        icon: { type: string }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    HotelAmenity:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        name_ar: { type: string, nullable: true }
        icon: { type: string, nullable: true }
        icon_url: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    HotelService:
      type: object
      properties:
        id: { type: integer }
        property: { type: integer, description: Hotel ID }
        property_name: { type: string }
        category: { type: integer, nullable: true, description: ServiceCategory ID }
        category_name: { type: string }
        name: { type: string }
        slug: { type: string }
        short_description: { type: string }
        description: { type: string }
        name_ar: { type: string, nullable: true }
        short_description_ar: { type: string, nullable: true }
        description_ar: { type: string, nullable: true }
        price: { type: string, description: Decimal as string }
        currency: { type: string }
        pricing_type: { type: string, enum: [on_request, fixed, per_person, per_hour] }
        duration_minutes: { type: integer, nullable: true }
        available_from: { type: string, nullable: true }
        available_until: { type: string, nullable: true }
        advance_booking_required: { type: boolean }
        is_featured: { type: boolean }
        is_active: { type: boolean }
        cover_image_url: { type: string, nullable: true }
        images: { type: array, items: { type: object } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PropertyImage:
      type: object
      properties:
        id: { type: integer }
        property: { type: integer, description: Hotel ID }
        image: { type: string, description: Image URL path }
        thumbnail: { type: string, nullable: true }
        caption: { type: string }
        alt_text: { type: string }
        display_order: { type: integer }
        is_cover: { type: boolean }
        is_active: { type: boolean }
        image_url: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AvailabilityResponse:
      type: object
      properties:
        property_id: { type: integer }
        property: { type: integer }
        property_name: { type: string }
        property_type: { type: string }
        check_in: { type: string }
        check_out: { type: string }
        is_available: { type: boolean }
        available_rooms: { type: array, items: { type: object } }
        units: { type: array, items: { type: object } }

    HealthCheck:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        checks:
          type: object
          properties:
            database: { type: string, enum: [ok], description: "ok or error: message" }
            cache: { type: string, enum: [ok], description: "ok or error: message" }
        timestamp: { type: string, format: date-time }
        app_env: { type: string }

paths:
  # ─── Health ─────────────────────────────────────────────────────────────
  /api/health/:
    get:
      tags: [System]
      summary: Health check endpoint
      description: Returns database and cache status. Laravel Cloud load balancer target.
      security: []
      responses:
        "200":
          description: All systems healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthCheck' }
              example:
                status: ok
                checks: { database: ok, cache: ok }
                timestamp: "2026-06-23T12:00:00Z"
                app_env: production
        "503":
          description: Service degraded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthCheck' }

  # ─── Public Hotel Context ──────────────────────────────────────────────
  /api/public/hotel-context/:
    get:
      tags: [Hotels]
      summary: Get resolved public hotel context
      description: Resolves hotel from X-Hotel-Subdomain header or hostname subdomain.
      security: []
      parameters:
        - $ref: '#/components/parameters/HotelSubdomainHeader'
      responses:
        "200":
          description: Hotel context resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  subdomain: { type: string, nullable: true }
                  status: { type: string, enum: [bypass, available, invalid, unavailable] }
                  property: { $ref: '#/components/schemas/Hotel' }

  # ─── Blog CMS ──────────────────────────────────────────────────────────
  /api/blog/posts/:
    get:
      tags: [Blog CMS]
      summary: List published blog posts
      description: Returns published blog posts whose published_at date has passed and whose category is active.
      security: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        "200":
          description: Paginated published blog posts
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PaginatedResponse' }
                  - type: object
                    properties:
                      results: { type: array, items: { $ref: '#/components/schemas/BlogPost' } }

  /api/blog/posts/{slug}/:
    get:
      tags: [Blog CMS]
      summary: Get published blog post by slug
      description: Returns one publicly visible blog post by slug, including linked hotel context when available.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Blog post detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlogPost' }
        "404":
          description: Blog post not found or not publicly visible

  /api/admin/blog/posts/:
    get:
      tags: [Blog CMS]
      summary: List blog posts (admin/staff)
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [draft, scheduled, published, archived] }
        - name: locale
          in: query
          schema: { type: string, enum: [ar, en] }
        - name: category_id
          in: query
          schema: { type: integer }
        - name: hotel_id
          in: query
          schema: { type: integer }
        - name: author_id
          in: query
          schema: { type: integer }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        "200":
          description: Paginated blog posts
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PaginatedResponse' }
                  - type: object
                    properties:
                      results: { type: array, items: { $ref: '#/components/schemas/BlogPost' } }
    post:
      tags: [Blog CMS]
      summary: Create a blog post (admin/staff)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BlogPostRequest' }
      responses:
        "201":
          description: Blog post created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlogPost' }
        "422":
          description: Validation error

  /api/admin/blog/posts/{id}/:
    get:
      tags: [Blog CMS]
      summary: Get blog post detail (admin/staff)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Blog post detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlogPost' }
    patch:
      tags: [Blog CMS]
      summary: Update a blog post (admin/staff)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BlogPostRequest' }
      responses:
        "200":
          description: Blog post updated
    put:
      tags: [Blog CMS]
      summary: Replace a blog post (admin/staff)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BlogPostRequest' }
      responses:
        "200":
          description: Blog post updated
    delete:
      tags: [Blog CMS]
      summary: Delete a blog post (admin/staff)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Blog post deleted

  /api/admin/blog/categories/:
    get:
      tags: [Blog CMS]
      summary: List blog categories (admin/staff)
      security:
        - BearerAuth: []
      parameters:
        - name: locale
          in: query
          schema: { type: string, enum: [ar, en] }
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        "200":
          description: Paginated blog categories
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PaginatedResponse' }
                  - type: object
                    properties:
                      results: { type: array, items: { $ref: '#/components/schemas/BlogCategory' } }
    post:
      tags: [Blog CMS]
      summary: Create a blog category (admin/staff)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BlogCategoryRequest' }
      responses:
        "201":
          description: Blog category created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlogCategory' }
        "422":
          description: Validation error

  /api/admin/blog/categories/{id}/:
    get:
      tags: [Blog CMS]
      summary: Get blog category detail (admin/staff)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Blog category detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlogCategory' }
    patch:
      tags: [Blog CMS]
      summary: Update a blog category (admin/staff)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BlogCategoryRequest' }
      responses:
        "200":
          description: Blog category updated
    put:
      tags: [Blog CMS]
      summary: Replace a blog category (admin/staff)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BlogCategoryRequest' }
      responses:
        "200":
          description: Blog category updated
    delete:
      tags: [Blog CMS]
      summary: Delete a blog category (admin/staff)
      description: Categories that still have blog posts cannot be deleted.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Blog category deleted
        "422":
          description: Category has blog posts

  # ─── Auth ──────────────────────────────────────────────────────────────
  /api/auth/signup/:
    post:
      tags: [Auth]
